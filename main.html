<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svetovni dan punc</title>
  <style>
    :root {
      --pink-1: #fff2f7;
      --pink-2: #ffd7e6;
      --pink-3: #f8a9c5;
      --pink-4: #d95485;
      --pink-5: #8f234c;
      --cream: #fffaf7;
      --text: #5c1d36;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 15%, rgba(255,255,255,.95), transparent 26%),
        radial-gradient(circle at 85% 22%, rgba(255,188,214,.55), transparent 28%),
        linear-gradient(145deg, #fff7fa 0%, #ffd9e7 46%, #f4a5c1 100%);
    }

    button,
    input {
      font: inherit;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      isolation: isolate;
    }

    .ambient {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: -1;
    }

    .glow {
      position: absolute;
      width: 44vw;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(55px);
      opacity: .3;
      animation: driftGlow 10s ease-in-out infinite alternate;
    }

    .glow.one {
      top: -18%;
      left: -10%;
      background: #ffffff;
    }

    .glow.two {
      right: -14%;
      bottom: -25%;
      background: #e86698;
      animation-delay: -4s;
    }

    .login-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      z-index: 20;
      transition: opacity 1s ease, visibility 1s ease, transform 1s ease;
    }

    .login-screen.hidden {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.08);
    }

    .login-card {
      width: min(440px, 100%);
      padding: 42px 34px 34px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 30px;
      background: rgba(255,250,252,.68);
      box-shadow: 0 25px 80px rgba(126, 37, 73, .24);
      backdrop-filter: blur(18px);
      animation: floatCard 5s ease-in-out infinite;
    }

    .mini-rose {
      width: 92px;
      height: 92px;
      margin: -4px auto 10px;
      filter: drop-shadow(0 12px 16px rgba(127, 30, 66, .25));
    }

    .login-title {
      margin: 0 0 8px;
      font-family: "Brush Script MT", "Segoe Script", "Lucida Handwriting", cursive;
      font-size: clamp(2.5rem, 8vw, 4rem);
      font-weight: 500;
      line-height: .95;
      color: #a72f5c;
    }

    .login-subtitle {
      margin: 0 auto 24px;
      max-width: 29ch;
      color: #7f4058;
      line-height: 1.55;
    }

    .password-wrap {
      position: relative;
    }

    .password-input {
      width: 100%;
      border: 1px solid rgba(150, 47, 86, .2);
      border-radius: 999px;
      padding: 16px 20px;
      outline: none;
      text-align: center;
      letter-spacing: .28em;
      color: var(--text);
      background: rgba(255,255,255,.75);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.85);
      transition: .25s ease;
    }

    .password-input:focus {
      border-color: rgba(191, 59, 108, .55);
      box-shadow: 0 0 0 5px rgba(219, 86, 135, .12);
    }

    .enter-button {
      width: 100%;
      margin-top: 13px;
      border: 0;
      border-radius: 999px;
      padding: 15px 20px;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #c43c70, #8f234c);
      box-shadow: 0 13px 30px rgba(143, 35, 76, .28);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .enter-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 17px 34px rgba(143, 35, 76, .34);
    }

    .enter-button:active {
      transform: translateY(0);
    }

    .error {
      min-height: 22px;
      margin: 12px 0 0;
      font-size: .92rem;
      color: #aa254f;
      opacity: 0;
      transform: translateY(-5px);
      transition: .25s ease;
    }

    .error.show {
      opacity: 1;
      transform: translateY(0);
    }

    .shake {
      animation: shake .45s ease;
    }

    .content {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      opacity: 0;
      visibility: hidden;
      transform: scale(.9);
      transition: opacity 1.2s ease .4s, visibility 1.2s ease .4s, transform 1.4s cubic-bezier(.2,.8,.2,1) .4s;
      z-index: 5;
    }

    .content.visible {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .message-card {
      position: relative;
      width: min(760px, 100%);
      max-height: calc(100vh - 56px);
      overflow: auto;
      padding: clamp(38px, 7vw, 72px);
      text-align: center;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 42px 16px 42px 16px;
      background: rgba(255,250,247,.72);
      box-shadow: 0 28px 90px rgba(114, 31, 64, .28);
      backdrop-filter: blur(22px);
    }

    .content.visible .message-card {
      animation: revealCard 1.4s cubic-bezier(.16,1,.3,1) both;
    }

    .eyebrow {
      margin: 0 0 16px;
      text-transform: uppercase;
      letter-spacing: .24em;
      font-size: .78rem;
      color: #a34468;
    }

    .main-title {
      margin: 0;
      font-family: "Brush Script MT", "Segoe Script", "Lucida Handwriting", cursive;
      font-size: clamp(3.4rem, 10vw, 7rem);
      font-weight: 500;
      line-height: .9;
      color: #a02957;
      text-shadow: 0 4px 18px rgba(155, 39, 81, .13);
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 24px auto;
      color: #cf668e;
    }

    .divider::before,
    .divider::after {
      content: "";
      width: 70px;
      height: 1px;
      background: linear-gradient(90deg, transparent, currentColor);
    }

    .divider::after {
      transform: scaleX(-1);
    }

    .message {
      max-width: 560px;
      margin: 0 auto;
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      line-height: 1.8;
      color: #6d3048;
    }

    .signature {
      margin: 26px 0 0;
      font-family: "Brush Script MT", "Segoe Script", "Lucida Handwriting", cursive;
      font-size: clamp(1.8rem, 5vw, 2.7rem);
      color: #b03563;
    }

    .bottom-text {
      position: absolute;
      left: 50%;
      bottom: 16px;
      width: calc(100% - 32px);
      margin: 0;
      transform: translateX(-50%);
      text-align: center;
      font-family: "Brush Script MT", "Segoe Script", "Lucida Handwriting", cursive;
      font-size: clamp(1.05rem, 3vw, 1.5rem);
      color: rgba(99, 27, 54, .82);
      opacity: 0;
      transition: opacity 1s ease 1.8s;
      z-index: 7;
    }

    .bottom-text.visible {
      opacity: 1;
    }

    .type-line {
      min-height: 1em;
    }

    .message.type-line {
      min-height: 7.2em;
    }

    .type-line.typing::after {
      content: "";
      display: inline-block;
      width: 2px;
      height: .9em;
      margin-left: 4px;
      vertical-align: -.08em;
      border-radius: 999px;
      background: currentColor;
      animation: cursorBlink .75s steps(1) infinite;
    }

    .divider {
      opacity: 0;
      transform: scale(.7);
      transition: opacity .6s ease, transform .8s cubic-bezier(.16,1,.3,1);
    }

    .divider.visible {
      opacity: 1;
      transform: scale(1);
    }

    .rose-storm {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 15;
    }

    .flying-rose {
      position: absolute;
      top: -150px;
      width: var(--size);
      height: var(--size);
      opacity: 0;
      filter: drop-shadow(0 12px 12px rgba(111, 28, 60, .22));
      animation: roseFlight var(--duration) cubic-bezier(.16,.72,.37,1) var(--delay) forwards;
      will-change: transform, opacity;
    }

    .flying-rose svg {
      width: 100%;
      height: 100%;
      animation: roseSpin var(--spin) ease-in-out infinite alternate;
    }

    .petal {
      position: absolute;
      width: 20px;
      height: 32px;
      border-radius: 80% 20% 75% 25%;
      background: linear-gradient(155deg, #ffd5e4, #d8497c 65%, #9c234e);
      box-shadow: inset 3px 3px 5px rgba(255,255,255,.35);
      opacity: 0;
      animation: petalFall var(--duration) linear var(--delay) forwards;
    }

    .open-flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 19;
      opacity: 0;
      background: radial-gradient(circle, rgba(255,255,255,.98) 0%, rgba(255,215,231,.92) 24%, rgba(230,93,143,.2) 58%, transparent 74%);
      transform: scale(.1);
    }

    .open-flash.active {
      animation: bloomFlash 1.4s cubic-bezier(.16,1,.3,1) forwards;
    }

    @keyframes cursorBlink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @keyframes driftGlow {
      from { transform: translate3d(-3%, -2%, 0) scale(1); }
      to { transform: translate3d(8%, 6%, 0) scale(1.14); }
    }

    @keyframes revealCard {
      0% {
        opacity: 0;
        transform: translateY(45px) rotateX(12deg) scale(.84);
        filter: blur(12px);
      }
      55% {
        opacity: 1;
        filter: blur(0);
      }
      100% {
        transform: translateY(0) rotateX(0) scale(1);
      }
    }

    @keyframes roseFlight {
      0% {
        opacity: 0;
        transform: translate3d(var(--start-x), -20vh, 0) rotate(-25deg) scale(.4);
      }
      12% {
        opacity: 1;
      }
      48% {
        transform: translate3d(var(--mid-x), 46vh, 0) rotate(170deg) scale(1.05);
      }
      88% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--end-x), 115vh, 0) rotate(390deg) scale(.78);
      }
    }

    @keyframes roseSpin {
      from { transform: rotate(-12deg) scale(.96); }
      to { transform: rotate(14deg) scale(1.05); }
    }

    @keyframes petalFall {
      0% {
        opacity: 0;
        transform: translate3d(0, -10vh, 0) rotate(0deg);
      }
      12% {
        opacity: .92;
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift), 115vh, 0) rotate(var(--rotation));
      }
    }

    @keyframes bloomFlash {
      0% {
        opacity: 0;
        transform: scale(.08);
      }
      24% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: scale(2.2);
      }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-9px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-5px); }
    }

    @media (max-width: 600px) {
      .login-card {
        padding: 34px 22px 28px;
        border-radius: 25px;
      }

      .message-card {
        padding: 38px 24px;
        border-radius: 30px 12px 30px 12px;
      }

      .bottom-text {
        bottom: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="ambient">
      <div class="glow one"></div>
      <div class="glow two"></div>
    </div>

    <section class="login-screen" id="loginScreen">
      <div class="login-card" id="loginCard">
        <svg class="mini-rose" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <radialGradient id="miniPetal" cx="35%" cy="28%">
              <stop offset="0%" stop-color="#ffd6e5"/>
              <stop offset="58%" stop-color="#e65c8d"/>
              <stop offset="100%" stop-color="#a52353"/>
            </radialGradient>
            <linearGradient id="miniLeaf" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#8bb679"/>
              <stop offset="100%" stop-color="#3f7549"/>
            </linearGradient>
          </defs>
          <path d="M58 70 C54 84 54 98 60 112" fill="none" stroke="#4c8052" stroke-width="4" stroke-linecap="round"/>
          <path d="M57 88 C44 78 35 82 31 96 C45 98 54 95 59 88" fill="url(#miniLeaf)"/>
          <path d="M60 95 C73 84 84 88 89 101 C76 104 67 102 60 95" fill="url(#miniLeaf)"/>
          <g transform="translate(60 52)">
            <ellipse rx="34" ry="18" transform="rotate(0)" fill="url(#miniPetal)"/>
            <ellipse rx="31" ry="17" transform="rotate(45)" fill="url(#miniPetal)"/>
            <ellipse rx="31" ry="17" transform="rotate(90)" fill="url(#miniPetal)"/>
            <ellipse rx="31" ry="17" transform="rotate(135)" fill="url(#miniPetal)"/>
            <ellipse rx="24" ry="14" transform="rotate(22)" fill="url(#miniPetal)"/>
            <ellipse rx="24" ry="14" transform="rotate(67)" fill="url(#miniPetal)"/>
            <ellipse rx="24" ry="14" transform="rotate(112)" fill="url(#miniPetal)"/>
            <ellipse rx="24" ry="14" transform="rotate(157)" fill="url(#miniPetal)"/>
            <path d="M-13 1 C-14 -13 2 -22 12 -12 C22 -2 13 13 0 15 C-8 14 -13 9 -13 1Z" fill="#8d1e48"/>
            <path d="M-7 1 C-5 -8 6 -9 9 -2 C12 5 5 10 -2 8 C-6 7 -8 5 -7 1Z" fill="#641437"/>
          </g>
        </svg>

        <h1 class="login-title">Za Jano</h1>
        <p class="login-subtitle">Bi upal, da vem zdaj pravo cifro.</p>

        <form id="loginForm">
          <div class="password-wrap">
            <input class="password-input" id="passwordInput" type="password" inputmode="numeric" maxlength="4" placeholder="••••" aria-label="Geslo" autocomplete="off">
          </div>
          <button class="enter-button" type="submit">Naprej</button>
          <p class="error" id="errorMessage">Ajajajajajajaj.</p>
        </form>
      </div>
    </section>

    <section class="content" id="content">
      <article class="message-card">
        <p class="eyebrow type-line" id="letterEyebrow" data-text="Sveotvni dan punc"></p>
        <h2 class="main-title type-line" id="letterTitle" data-text="Draga Jana"></h2>
        <div class="divider" id="letterDivider">♡</div>
        <p class="message type-line" id="letterMessage" data-text="Te rože bi ti najraje dal v živo, ampak upam, da je tudi to lep način, da ti pokažem, koliko mi pomeniš. Res sem ti hvaležen za potrpežljivost, ki jo imaš z mano, in za to, da sem se zaradi tebe izboljšal v stvareh, ki mi prej morda niso bile tako pomembne."></p>
        <p class="signature type-line" id="letterSignature" data-text="Uživaj na potovanjue, tvoj Luka"></p>
      </article>
    </section>

    <div class="rose-storm" id="roseStorm"></div>
    <div class="open-flash" id="openFlash"></div>
  </main>

  <script>
    const correctPassword = "1826";
    const loginForm = document.getElementById("loginForm");
    const passwordInput = document.getElementById("passwordInput");
    const loginScreen = document.getElementById("loginScreen");
    const loginCard = document.getElementById("loginCard");
    const errorMessage = document.getElementById("errorMessage");
    const content = document.getElementById("content");
    const roseStorm = document.getElementById("roseStorm");
    const openFlash = document.getElementById("openFlash");
    const letterEyebrow = document.getElementById("letterEyebrow");
    const letterTitle = document.getElementById("letterTitle");
    const letterDivider = document.getElementById("letterDivider");
    const letterMessage = document.getElementById("letterMessage");
    const letterSignature = document.getElementById("letterSignature");

    const pause = (time) => new Promise((resolve) => window.setTimeout(resolve, time));

    const typeText = async (element, speed) => {
      const text = element.dataset.text || "";
      element.textContent = "";
      element.classList.add("typing");

      for (const character of text) {
        element.textContent += character;
        const punctuationPause = /[.!?]/.test(character) ? 180 : /[,;]/.test(character) ? 90 : 0;
        await pause(speed + Math.random() * speed * .55 + punctuationPause);
      }

      element.classList.remove("typing");
    };

    const writeLetter = async () => {
      await pause(1250);
      await typeText(letterEyebrow, 45);
      await pause(180);
      await typeText(letterTitle, 105);
      letterDivider.classList.add("visible");
      await pause(650);
      await typeText(letterMessage, 34);
      await pause(500);
      await typeText(letterSignature, 85);
    };

    const roseSVG = (index) => {
      const hue = index % 3;
      const colors = [
        ["#ffd4e3", "#df4c80", "#991f4d", "#651433"],
        ["#ffe5ed", "#f06b99", "#bd2e62", "#7e183e"],
        ["#ffc5d8", "#cf3b70", "#8f1c48", "#57102d"]
      ][hue];

      return `
        <svg viewBox="0 0 140 170" aria-hidden="true">
          <defs>
            <radialGradient id="petal${index}" cx="36%" cy="28%">
              <stop offset="0%" stop-color="${colors[0]}"/>
              <stop offset="58%" stop-color="${colors[1]}"/>
              <stop offset="100%" stop-color="${colors[2]}"/>
            </radialGradient>
            <linearGradient id="leaf${index}" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#94bd7e"/>
              <stop offset="100%" stop-color="#3f7549"/>
            </linearGradient>
          </defs>
          <path d="M69 92 C66 112 65 135 73 163" fill="none" stroke="#4d7d50" stroke-width="5" stroke-linecap="round"/>
          <path d="M68 120 C50 105 37 111 32 130 C49 134 62 130 70 121" fill="url(#leaf${index})"/>
          <path d="M70 137 C88 120 104 127 109 146 C92 150 79 147 70 137" fill="url(#leaf${index})"/>
          <g transform="translate(70 70)">
            <ellipse rx="43" ry="23" transform="rotate(0)" fill="url(#petal${index})"/>
            <ellipse rx="40" ry="22" transform="rotate(45)" fill="url(#petal${index})"/>
            <ellipse rx="40" ry="22" transform="rotate(90)" fill="url(#petal${index})"/>
            <ellipse rx="40" ry="22" transform="rotate(135)" fill="url(#petal${index})"/>
            <ellipse rx="34" ry="19" transform="rotate(22)" fill="url(#petal${index})"/>
            <ellipse rx="34" ry="19" transform="rotate(67)" fill="url(#petal${index})"/>
            <ellipse rx="34" ry="19" transform="rotate(112)" fill="url(#petal${index})"/>
            <ellipse rx="34" ry="19" transform="rotate(157)" fill="url(#petal${index})"/>
            <ellipse rx="26" ry="16" transform="rotate(0)" fill="${colors[2]}"/>
            <ellipse rx="26" ry="16" transform="rotate(60)" fill="${colors[2]}"/>
            <ellipse rx="26" ry="16" transform="rotate(120)" fill="${colors[2]}"/>
            <path d="M-16 1 C-17 -17 3 -27 16 -14 C28 -2 16 17 0 19 C-10 18 -16 11 -16 1Z" fill="${colors[3]}"/>
            <path d="M-8 1 C-6 -10 7 -12 11 -3 C15 6 6 12 -3 10 C-7 9 -9 6 -8 1Z" fill="#4e0d28"/>
          </g>
        </svg>
      `;
    };

    const createRoseStorm = () => {
      roseStorm.innerHTML = "";

      for (let i = 0; i < 30; i += 1) {
        const rose = document.createElement("div");
        rose.className = "flying-rose";
        const size = 58 + Math.random() * 86;
        const startX = -15 + Math.random() * 115;
        const midX = Math.max(-12, Math.min(112, startX + (-25 + Math.random() * 50)));
        const endX = Math.max(-15, Math.min(115, midX + (-28 + Math.random() * 56)));

        rose.style.left = "0";
        rose.style.setProperty("--size", `${size}px`);
        rose.style.setProperty("--start-x", `${startX}vw`);
        rose.style.setProperty("--mid-x", `${midX}vw`);
        rose.style.setProperty("--end-x", `${endX}vw`);
        rose.style.setProperty("--duration", `${4.4 + Math.random() * 3.2}s`);
        rose.style.setProperty("--delay", `${Math.random() * 2.2}s`);
        rose.style.setProperty("--spin", `${1.8 + Math.random() * 2.4}s`);
        rose.innerHTML = roseSVG(i);
        roseStorm.appendChild(rose);
      }

      for (let i = 0; i < 45; i += 1) {
        const petal = document.createElement("div");
        petal.className = "petal";
        petal.style.left = `${Math.random() * 100}vw`;
        petal.style.top = `${-20 - Math.random() * 30}px`;
        petal.style.setProperty("--duration", `${4 + Math.random() * 4}s`);
        petal.style.setProperty("--delay", `${Math.random() * 2.8}s`);
        petal.style.setProperty("--drift", `${-160 + Math.random() * 320}px`);
        petal.style.setProperty("--rotation", `${240 + Math.random() * 820}deg`);
        petal.style.transform = `scale(${.55 + Math.random() * .85})`;
        roseStorm.appendChild(petal);
      }

      window.setTimeout(() => {
        roseStorm.innerHTML = "";
      }, 9500);
    };

    const unlock = () => {
      errorMessage.classList.remove("show");
      openFlash.classList.add("active");
      createRoseStorm();

      window.setTimeout(() => {
        loginScreen.classList.add("hidden");
        content.classList.add("visible");
        writeLetter();
      }, 420);
    };

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();

      if (passwordInput.value === correctPassword) {
        unlock();
        return;
      }

      errorMessage.classList.add("show");
      loginCard.classList.remove("shake");
      void loginCard.offsetWidth;
      loginCard.classList.add("shake");
      passwordInput.value = "";
      passwordInput.focus();
    });

    passwordInput.addEventListener("input", () => {
      passwordInput.value = passwordInput.value.replace(/\D/g, "").slice(0, 4);
      errorMessage.classList.remove("show");
    });
  </script>
</body>
</html>
