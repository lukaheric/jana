<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="theme-color" content="#fff7fa" />
	<title>Za Jano</title>

	<style>
		:root {
			--ui-scale: 0.86;
			--background: #fff7fa;
			--text: #4d3540;
			--accent: #d86c91;
			--accent-dark: #a84168;
			--paper: rgba(255, 255, 255, 0.88);
			--stem: #568b5e;
			--leaf: #70a777;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			min-height: 100%;
			margin: 0;
		}

		body {
			overflow-x: hidden;
			background:
				radial-gradient(circle at 20% 10%, #ffffff 0 12%, transparent 30%),
				radial-gradient(circle at 80% 20%, #ffe8f0 0 10%, transparent 28%),
				linear-gradient(145deg, #fffafc, var(--background));
			color: var(--text);
			font-family: Georgia, "Times New Roman", serif;
		}

		button,
		input {
			font: inherit;
		}

		.screen {
			min-height: 100svh;
			width: 100%;
		}

		/* ---------- Entry screen ---------- */

		#entry-screen {
			display: grid;
			place-items: center;
			padding: 24px;
			transition: opacity 700ms ease, transform 700ms ease;
		}

		#entry-screen.hidden {
			opacity: 0;
			transform: scale(1.04);
			pointer-events: none;
			position: fixed;
			inset: 0;
		}

		.entry-card {
			width: min(380px, 92%);
			transform: scale(var(--ui-scale));
			transform-origin: center;
			padding: 36px 28px;
			border: 1px solid rgba(216, 108, 145, 0.18);
			border-radius: 28px;
			background: rgba(255, 255, 255, 0.76);
			box-shadow: 0 20px 70px rgba(125, 63, 86, 0.13);
			text-align: center;
			backdrop-filter: blur(12px);
		}

		.tiny-flower {
			margin-bottom: 14px;
			font-size: 38px;
			animation: breathe 2.6s ease-in-out infinite;
		}

		h1 {
			margin: 0 0 12px;
			font-size: clamp(2rem, 8vw, 3rem);
			font-weight: 500;
			letter-spacing: -0.03em;
		}

		.entry-card p {
			margin: 0 0 24px;
			line-height: 1.6;
			opacity: 0.8;
		}

		.code-row {
			display: flex;
			gap: 10px;
		}

		#secret-input {
			width: 100%;
			min-width: 0;
			padding: 14px 16px;
			border: 1px solid rgba(77, 53, 64, 0.2);
			border-radius: 14px;
			outline: none;
			background: white;
			color: var(--text);
			text-align: center;
			letter-spacing: 0.18em;
			transition: border 180ms ease, box-shadow 180ms ease;
		}

		#secret-input:focus {
			border-color: var(--accent);
			box-shadow: 0 0 0 4px rgba(216, 108, 145, 0.12);
		}

		#open-button {
			flex: 0 0 auto;
			padding: 14px 20px;
			border: 0;
			border-radius: 14px;
			background: var(--accent);
			color: white;
			cursor: pointer;
			box-shadow: 0 9px 24px rgba(216, 108, 145, 0.28);
			transition: transform 180ms ease, background 180ms ease;
		}

		#open-button:hover {
			background: var(--accent-dark);
			transform: translateY(-2px);
		}

		#error-message {
			min-height: 22px;
			margin-top: 14px;
			color: #b54463;
			font-size: 0.92rem;
		}

		.shake {
			animation: shake 420ms ease;
		}

		/* ---------- Surprise screen ---------- */

		#surprise-screen {
			display: none;
			position: relative;
			overflow: hidden;
			align-items: center;
			justify-content: center;
			padding: 24px 16px 50px;
		}

		#surprise-screen.active {
			display: flex;
		}

		.soft-light {
			position: fixed;
			inset: -20%;
			pointer-events: none;
			background:
				radial-gradient(circle at 50% 75%, rgba(255,255,255,0.96), transparent 34%),
				radial-gradient(circle at 50% 40%, rgba(255,218,231,0.5), transparent 46%);
			animation: glow 5s ease-in-out infinite alternate;
		}

		#petal-layer {
			position: fixed;
			inset: 0;
			overflow: hidden;
			pointer-events: none;
			z-index: 1;
		}

		.falling-petal {
			position: absolute;
			top: -40px;
			width: 13px;
			height: 19px;
			border-radius: 70% 30% 70% 30%;
			opacity: 0;
			animation: fall linear forwards;
		}

		.scene {
			position: relative;
			transform: scale(var(--ui-scale));
			transform-origin: top center;
			z-index: 2;
			width: min(820px, 100%);
			gap: 24px;
			display: grid;
			justify-items: center;
		}

		.bouquet {
			position: relative;
			width: min(650px, 100%);
			height: clamp(255px, 47vw, 405px);
			transform-origin: center bottom;
			animation: bouquetRise 1.5s cubic-bezier(.18,.85,.28,1) both;
		}

		.flower {
			position: absolute;
			left: var(--x);
			bottom: var(--bottom);
			width: var(--size);
			height: calc(var(--size) + var(--stem-length));
			transform: translateX(-50%) rotate(var(--tilt)) scale(0);
			transform-origin: center bottom;
			animation: flowerGrow 1.2s cubic-bezier(.2,.85,.25,1.15) forwards;
			animation-delay: var(--delay);
		}

		.stem {
			position: absolute;
			bottom: 0;
			left: 50%;
			width: max(4px, calc(var(--size) * 0.055));
			height: var(--stem-length);
			transform: translateX(-50%);
			border-radius: 999px;
			background: linear-gradient(to right, #477b50, var(--stem), #477b50);
		}

		.leaf {
			position: absolute;
			width: calc(var(--size) * 0.34);
			height: calc(var(--size) * 0.17);
			border-radius: 100% 0 100% 0;
			background: linear-gradient(135deg, var(--leaf), #4f8b59);
		}

		.leaf.left {
			left: 50%;
			bottom: calc(var(--stem-length) * 0.38);
			transform: translateX(-95%) rotate(22deg);
		}

		.leaf.right {
			left: 50%;
			bottom: calc(var(--stem-length) * 0.58);
			transform: translateX(2%) rotate(158deg);
		}

		.bloom {
			position: absolute;
			top: 0;
			left: 50%;
			width: var(--size);
			height: var(--size);
			transform: translateX(-50%);
			animation: bloomSpin 8s linear infinite;
		}

		.petal {
			position: absolute;
			left: 50%;
			top: 50%;
			width: 42%;
			height: 58%;
			transform-origin: 50% 100%;
			border-radius: 65% 65% 48% 48%;
			background:
				radial-gradient(circle at 50% 78%, rgba(255,255,255,0.5), transparent 30%),
				linear-gradient(to top, var(--petal-dark), var(--petal-light));
			box-shadow: inset 0 -8px 14px rgba(135, 41, 76, 0.08);
		}

		.petal:nth-child(1) { transform: translate(-50%, -100%) rotate(0deg); }
		.petal:nth-child(2) { transform: translate(-50%, -100%) rotate(60deg); }
		.petal:nth-child(3) { transform: translate(-50%, -100%) rotate(120deg); }
		.petal:nth-child(4) { transform: translate(-50%, -100%) rotate(180deg); }
		.petal:nth-child(5) { transform: translate(-50%, -100%) rotate(240deg); }
		.petal:nth-child(6) { transform: translate(-50%, -100%) rotate(300deg); }

		.center {
			position: absolute;
			left: 50%;
			top: 50%;
			width: 31%;
			height: 31%;
			transform: translate(-50%, -50%);
			border-radius: 50%;
			background:
				radial-gradient(circle at 35% 35%, #fff2ac, transparent 22%),
				radial-gradient(circle, #e8ad43, #b86d25);
			box-shadow: 0 4px 12px rgba(103, 52, 20, 0.25);
		}

		/* ---------- Letter ---------- */

		.letter {
			width: min(590px, 100%);
			padding: clamp(24px, 5.5vw, 44px);
			border: 1px solid rgba(216, 108, 145, 0.15);
			border-radius: 8px 28px 8px 28px;
			background: var(--paper);
			box-shadow: 0 24px 80px rgba(98, 55, 70, 0.16);
			opacity: 0;
			transform: translateY(26px);
			backdrop-filter: blur(10px);
			transition: opacity 1s ease, transform 1s ease;
		}

		.letter.visible {
			opacity: 1;
			transform: translateY(0);
		}

		.letter h2 {
			margin: 0 0 22px;
			font-size: clamp(1.45rem, 5vw, 2.1rem);
			font-weight: 500;
			color: var(--accent-dark);
		}

		#letter-lines {
			min-height: 135px;
		}

		.letter-line {
			margin: 0 0 13px;
			font-size: clamp(0.96rem, 3.2vw, 1.1rem);
			opacity: 0;
			transform: translateY(10px);
			line-height: 1.75;
			transition: opacity 850ms ease, transform 850ms ease;
		}

		.letter-line.visible {
			opacity: 1;
			transform: translateY(0);
		}

		.signature {
			margin-top: 22px;
			font-style: italic;
			font-size: 1.04rem;
			color: var(--accent-dark);
			opacity: 0;
			transition: opacity 900ms ease;
		}

		.signature.visible {
			opacity: 1;
		}

		@keyframes breathe {
			0%, 100% { transform: scale(1) rotate(-3deg); }
			50% { transform: scale(1.12) rotate(3deg); }
		}

		@keyframes shake {
			0%, 100% { transform: translateX(0); }
			25% { transform: translateX(-8px); }
			50% { transform: translateX(8px); }
			75% { transform: translateX(-5px); }
		}

		@keyframes glow {
			from { transform: scale(0.96); opacity: 0.78; }
			to { transform: scale(1.05); opacity: 1; }
		}

		@keyframes bouquetRise {
			from { opacity: 0; transform: translateY(70px) scale(0.88); }
			to { opacity: 1; transform: translateY(0) scale(1); }
		}

		@keyframes flowerGrow {
			0% {
				opacity: 0;
				transform: translateX(-50%) rotate(var(--tilt)) scale(0);
			}
			70% {
				opacity: 1;
				transform: translateX(-50%) rotate(var(--tilt)) scale(1.08);
			}
			100% {
				opacity: 1;
				transform: translateX(-50%) rotate(var(--tilt)) scale(1);
			}
		}

		@keyframes bloomSpin {
			0%, 100% { transform: translateX(-50%) rotate(-2deg); }
			50% { transform: translateX(-50%) rotate(2deg); }
		}

		@keyframes fall {
			0% {
				opacity: 0;
				transform: translate3d(0, -30px, 0) rotate(0deg);
			}
			10% { opacity: 0.8; }
			100% {
				opacity: 0;
				transform: translate3d(var(--drift), 110vh, 0) rotate(var(--spin));
			}
		}

		@media (max-width: 560px) {
			:root {
				--ui-scale: 0.82;
			}
			.code-row {
				flex-direction: column;
			}

			#open-button {
				width: 100%;
			}

			.bouquet {
				margin-top: 15px;
			}
		}

		@media (prefers-reduced-motion: reduce) {
			*,
			*::before,
			*::after {
				animation-duration: 0.01ms !important;
				animation-delay: 0ms !important;
				scroll-behavior: auto !important;
			}
		}
	</style>
</head>

<body>
	<main>
		<section id="entry-screen" class="screen">
			<div class="entry-card" id="entry-card">
				<div class="tiny-flower">🌸</div>
				<h1>Za nekoga</h1>
				<p>Mislim da sem ti enkrat omenil, kaj je moje novo go to število...</p>

				<form id="secret-form">
					<div class="code-row">
						<input
							id="secret-input"
							type="password"
							inputmode="numeric"
							autocomplete="off"
							placeholder="••••"
							aria-label="Secret number"
							required
						/>
						<button id="open-button" type="submit">Odpri</button>
					</div>
					<div id="error-message" aria-live="polite"></div>
				</form>
			</div>
		</section>

		<section id="surprise-screen" class="screen" aria-hidden="true">
			<div class="soft-light"></div>
			<div id="petal-layer"></div>

			<div class="scene">
				<div class="bouquet" id="bouquet" aria-label="An animated bouquet of flowers"></div>

				<article class="letter" id="letter">
					<h2 id="letter-heading"></h2>
					<div id="letter-lines"></div>
					<div class="signature" id="signature"></div>
				</article>
			</div>
		</section>
	</main>

	<script>
		const CONFIG = {
			secretNumber: "1836",
			letterLines: [
				"Si želim, da bi ti lahko dal rože v živo.",
				"Ampak na žalost sem malo v napačni državi.",
				"Bilokoliko je razdalja med nama, te bom vedno imel v srcu.",
				"Hvala da si ti ti, in da mi polepšaš vsak dan.",
				"Se veselim da pridem nazaj, da te bom lahko objel."
			],
			signature: "Rad te imam, Luka",
			lineDelay: 1450,
			letterStartDelay: 2600
		};
		const flowerData = [
			{ x: "12%", bottom: "1%", size: "80px",  stem: "215px", tilt: "-14deg", delay: "0.20s", light: "#ffd4e3", dark: "#ea8eaf" },
			{ x: "24%", bottom: "0%", size: "105px", stem: "250px", tilt: "-9deg",  delay: "0.45s", light: "#fff0f4", dark: "#e88fae" },
			{ x: "37%", bottom: "0%", size: "92px",  stem: "285px", tilt: "-4deg",  delay: "0.70s", light: "#efceff", dark: "#bc83db" },
			{ x: "50%", bottom: "0%", size: "125px", stem: "305px", tilt: "0deg",   delay: "0.95s", light: "#ffcfdf", dark: "#df6f99" },
			{ x: "63%", bottom: "0%", size: "96px",  stem: "280px", tilt: "5deg",   delay: "1.20s", light: "#fff1c9", dark: "#e2ad59" },
			{ x: "76%", bottom: "0%", size: "108px", stem: "245px", tilt: "9deg",   delay: "1.45s", light: "#ffd9e5", dark: "#e783a6" },
			{ x: "88%", bottom: "1%", size: "82px",  stem: "210px", tilt: "14deg",  delay: "1.70s", light: "#dcecff", dark: "#8baede" }
		];

		const entryScreen = document.getElementById("entry-screen");
		const surpriseScreen = document.getElementById("surprise-screen");
		const form = document.getElementById("secret-form");
		const input = document.getElementById("secret-input");
		const errorMessage = document.getElementById("error-message");
		const entryCard = document.getElementById("entry-card");
		const bouquet = document.getElementById("bouquet");
		const letter = document.getElementById("letter");
		const letterHeading = document.getElementById("letter-heading");
		const letterLines = document.getElementById("letter-lines");
		const signature = document.getElementById("signature");

		function createFlowers() {
			bouquet.innerHTML = "";

			flowerData.forEach((data) => {
				const flower = document.createElement("div");
				flower.className = "flower";

				flower.style.setProperty("--x", data.x);
				flower.style.setProperty("--bottom", data.bottom);
				flower.style.setProperty("--size", data.size);
				flower.style.setProperty("--stem-length", data.stem);
				flower.style.setProperty("--tilt", data.tilt);
				flower.style.setProperty("--delay", data.delay);
				flower.style.setProperty("--petal-light", data.light);
				flower.style.setProperty("--petal-dark", data.dark);

				flower.innerHTML = `
					<div class="stem"></div>
					<div class="leaf left"></div>
					<div class="leaf right"></div>
					<div class="bloom">
						<span class="petal"></span>
						<span class="petal"></span>
						<span class="petal"></span>
						<span class="petal"></span>
						<span class="petal"></span>
						<span class="petal"></span>
						<span class="center"></span>
					</div>
				`;
				bouquet.appendChild(flower);
			});
		}

		function createPetalRain() {
			const layer = document.getElementById("petal-layer");
			const colors = ["#f5a9c1", "#ffd0df", "#ddb4ef", "#f8cf8b"];

			for (let i = 0; i < 34; i++) {
				const petal = document.createElement("span");
				petal.className = "falling-petal";
				petal.style.left = Math.random() * 100 + "vw";
				petal.style.background = colors[Math.floor(Math.random() * colors.length)];
				petal.style.setProperty("--drift", (Math.random() * 220 - 110) + "px");
				petal.style.setProperty("--spin", (Math.random() * 720 - 360) + "deg");
				petal.style.animationDuration = (7 + Math.random() * 7) + "s";
				petal.style.animationDelay = (Math.random() * 9) + "s";
				layer.appendChild(petal);
			}
		}

		function prepareLetter() {
			letterHeading.textContent = `Draga Jana,`;
			signature.textContent = CONFIG.signature;
			letterLines.innerHTML = "";

			CONFIG.letterLines.forEach((line) => {
				const paragraph = document.createElement("p");
				paragraph.className = "letter-line";
				paragraph.textContent = line;
				letterLines.appendChild(paragraph);
			});
		}

		function revealLetter() {
			letter.classList.add("visible");

			const lines = [...document.querySelectorAll(".letter-line")];

			lines.forEach((line, index) => {
				setTimeout(() => {
					line.classList.add("visible");
				}, 700 + index * CONFIG.lineDelay);
			});

			setTimeout(() => {
				signature.classList.add("visible");
			}, 900 + lines.length * CONFIG.lineDelay);
		}

		function openSurprise() {
			entryScreen.classList.add("hidden");
			surpriseScreen.classList.add("active");
			surpriseScreen.setAttribute("aria-hidden", "false");

			createFlowers();
			createPetalRain();
			prepareLetter();

			setTimeout(revealLetter, CONFIG.letterStartDelay);
		}

		function showError() {
			errorMessage.textContent = "That is not our number. Try again ♡";
			entryCard.classList.remove("shake");
			void entryCard.offsetWidth;
			entryCard.classList.add("shake");
			input.select();
		}

		form.addEventListener("submit", (event) => {
			event.preventDefault();

			if (input.value.trim() === CONFIG.secretNumber) {
				errorMessage.textContent = "";
				openSurprise();
			} else {
				showError();
			}
		});
	</script>
</body>
</html>
